version: 0.2

phases:
  install:
    commands:
      - echo "Đang chuẩn bị môi trường..."
      - pip install mlflow boto3 bentoml openpyxl pandas numpy xgboost scikit-learn psycopg2-binary
      - echo "Cài đặt Trivy..."
      # Sử dụng script kiểm tra hệ điều hành để cài đặt Trivy tương ứng (Ubuntu/Amazon Linux)
      - |
        if command -v apt-get >/dev/null 2>&1; then
          echo "Hệ điều hành Debian/Ubuntu phát hiện, dùng apt-get..."
          apt-get update && apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | tee -a /etc/apt/sources.list.d/trivy.list
          apt-get update && apt-get install -y trivy
        elif command -v yum >/dev/null 2>&1; then
          echo "Hệ điều hành Amazon Linux/RedHat phát hiện, dùng yum..."
          cat << 'EOF' > /etc/yum.repos.d/trivy.repo
        [trivy]
        name=Trivy repository
        baseurl=https://aquasecurity.github.io/trivy-repo/rpm/releases/$basearch/
        gpgcheck=1
        gpgkey=https://aquasecurity.github.io/trivy-repo/rpm/public.key
        enabled=1
        EOF
          yum install -y trivy
        else
          echo "Không tìm thấy apt hoặc yum. Tải static binary..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        fi
  pre_build:
    commands:
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - echo "Đăng nhập vào Amazon ECR cho tài khoản $AWS_ACCOUNT_ID..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo "Tải mô hình Staging từ MLflow..."
      - python scripts/download_model.py
  build:
    commands:
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - echo "Đóng gói BentoML..."
      - bentoml build
      - echo "Build Docker image từ BentoML..."
      # BentoML tự sinh Dockerfile và build Docker
      - bento_tag=$(bentoml list -o json | python -c 'import sys, json; print(json.load(sys.stdin)[0]["tag"])')
      - echo "Tag của Bento vừa build là $bento_tag"
      - bentoml containerize $bento_tag -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/nt114-mlops-repo:latest
      
      # Chạy quét bảo mật để kiểm toán (audit), in danh sách lỗ hổng ra log nhưng không chặn build (--exit-code 0)
      - trivy image --severity HIGH,CRITICAL --exit-code 0 $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/nt114-mlops-repo:latest
  post_build:
    commands:
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - echo "Đẩy Docker image lên Amazon ECR..."
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/nt114-mlops-repo:latest
      - echo "Tạo tệp imagedefinitions.json phục vụ CodeDeploy..."
      # File này báo cho ECS biết container nào sẽ thay thế bằng ECR image mới
      - printf '[{"name":"bentoml-service","imageUri":"%s"}]' "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/nt114-mlops-repo:latest" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
